[package]
name = "papercraft-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "papercraft_core"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"] # only the bindings generator needs this; keeps the Android build lean

[dependencies]
uniffi = "0.33"
encoding_rs = "0.8"
chardetng = "1"
csv = "1.4.0"
mail-parser = "1.0.2"
image = { version = "0.25.10", default-features = false, features = ["tiff"] }
# Latin + Hebrew/Arabic fonts only; CJK (26.7 MB) stays out of the APK.
betteroffice-docx = { version = "0.6.0", default-features = false, features = ["raster", "fonts-latin"] }
# The Word engine's parts, for laying a document out once and drawing pages from the retained layout.
betteroffice-docx-edit = "0.6.0"
betteroffice-docx-layout = "0.6.0"
betteroffice-docx-parse = "0.6.0"
betteroffice-docx-raster = "0.6.0"
betteroffice-ooxml-text = "0.6.0"
betteroffice-opc = "0.6.0"
serde_json = "1"
betteroffice-pptx = { version = "0.6.0", default-features = false, features = ["raster", "fonts-latin"] }
betteroffice-xlsx = { version = "0.6.0", default-features = false, features = ["raster", "fonts-latin"] }
office_oxide = "0.1.17"
# The spreadsheet grid reads cells straight from the engine's parser (`sheet.rs`).
betteroffice-xlsx-model = "0.6.0"
betteroffice-xlsx-parse = "0.6.0"
quick-xml = "0.41"
oem_cp = "2.1"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo" # full strip would delete the UniFFI metadata the bindings generator reads
