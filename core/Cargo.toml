[package]
name = "papercraft-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "papercraft_core"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"] # only the bindings generator needs this; keeps the Android build lean

[dependencies]
uniffi = "0.33"
encoding_rs = "0.8"
chardetng = "1"
csv = "1.4.0"
mail-parser = "1.0.2"
image = { version = "0.25.10", default-features = false, features = ["tiff"] }
# Latin + Hebrew/Arabic fonts only; CJK (26.7 MB) stays out of the APK.
betteroffice-docx = { version = "0.6.0", default-features = false, features = ["raster", "fonts-latin"] }
betteroffice-pptx = { version = "0.6.0", default-features = false, features = ["raster", "fonts-latin"] }
betteroffice-xlsx = { version = "0.6.0", default-features = false, features = ["raster", "fonts-latin"] }
office_oxide = "0.1.17"
pdfium-render = { version = "0.9.6", default-features = false, features = ["pdfium_8125"] } # bindings only; libpdfium.so is bblanchon/pdfium-binaries chromium/8125 (build.gradle.kts, ci.yml)

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo" # full strip would delete the UniFFI metadata the bindings generator reads
